<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Simi — the story (60 s)</title>
<style>
  @font-face { font-family: "Fredoka"; src: url("assets/fredoka.woff2") format("woff2"); font-weight: 300 700; }
  html, body { margin: 0; height: 100%; background: #10151f; overflow: hidden; font-family: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }

  #bar button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 0; background: #bafa67; color: #1f2a3c; font-weight: 700; cursor: pointer; }

<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar"><button id="play">Play with sound</button><input id="scrub" type="range" min="0" max="60" step="0.01" value="0"><span id="clock">0.0 s</span></div>
<script>
// Play Simi — the story. A 60-second animated introduction, drawn on a canvas.
// No footage and no audio files: the picture is code and the music is
// synthesised. 120 beats a minute, a beat is half a second, every scene starts
// on a bar (two seconds). render.mjs turns it into an MP4.
//
// Everything a viewer reads is in CONFIG.text; the numbers come from the git
// history (first commit 3 October 2026, pull request #89 merged by 11 October).
// The voices are assets/voice/<id>.mp3, spoken by story-voice.py from
// story-voice.json; CONFIG.voice says when each one plays.
const CONFIG = {
  fps: 30,
  duration: 60,
  url: "playsimi.danielquek.com",
  scenes: { hook: 0, memories: 8, quiet: 16, spark: 24, build: 32, open: 42, logo: 52 },
  // Spoken lines: clip id, start time in seconds, loudness. The music dips under each one.
  voice: [
    ["shout", 0.7, 1.1], ["coming", 2.9, 0.9], ["wait", 3.3, 0.9], ["noplan", 4.05, 1.3], ["downstairs", 6.15, 1.4],
    ["dragon", 8.3, 1.3], ["chapteh", 10.4, 1.3], ["icepop", 12.25, 1.3], ["catching", 14.15, 1.3],
    ["grewup", 18.7, 1.3], ["online", 20.5, 1.3], ["question", 24.4, 1.3], ["whatif", 26.9, 1.3], ["start", 30.0, 1.3],
    ["build", 32.3, 1.3], ["name", 38.5, 1.3], ["playsimi", 40.6, 1.1],
    ["open", 42.5, 1.3], ["comedown", 44.5, 1.1], ["free", 46.2, 1.3], ["aim", 48.3, 1.3], ["title", 52.8, 1.4], ["faster", 56.9, 1.1],
  ],

  years: [1999, 2026], // the time-lapse counter in the "quiet" scene
  text: {
    place: "Singapore, 6pm.",
    placeSub: "Back then.",
    shout: "OI! COME DOWN LAH!",
    replies: ["COMING!", "WAIT AH!"],
    noPlan: ["No group chat.", "No plan."],
    threeWords: "Just three words:",
    downstairs: ["Meet you", "downstairs."],
    memories: [
      ["The dragon", "playground."],
      ["Chapteh", "till dinner."],
      ["Ice pops from", "the mama shop."],
      ["Catching at", "the void deck."],
    ],
    grewUp: ["Then we", "grew up."],
    online: ["Everyone’s online."],
    nobody: ["Nobody’s", "downstairs."],
    date: "3 October 2026.",
    question: "One question:",
    whatIf: ["What if downstairs", "was online?"],
    terminal: ["$ git commit -m", "  \"Build the neighbourhood\"", "→ pull request 1 of 89", "✔ live the same day · free tier"],
    pieces: ["Void-deck Arcade Row", "Mama Shop", "Dragon playground", "Kopi the cat", "Coast Rush", "Fishing jetty", "Open Stage"],
    name: "PLAY SIMI",
    simi: "“simi” = “what?” in Singlish",
    playSimi: "Eh, play simi?",
    tally: "9 days · 8 games · 1 neighbourhood",
    openAgain: ["So downstairs", "is open again."],
    free: ["Free. In your browser.", "No download."],
    aim: ["Race. Dance. Fish.", "Dress up. Or just", "hang out,", "like we used to."],
    chat: ["Eh, come down!", "Play simi?", "Race lah!", "One more round!"],
    title: "Play Simi",
    tagline: "Meet you downstairs.",
    stats: ["89 pull requests", "9 days", "8 games", "Made in Singapore"],
    credit: "Built by Daniel Quek",
  },
  pullRequests: 89,
  // Commits per day, 3–11 October 2026: the bars under the counter.
  days: [25, 52, 55, 25, 29, 15, 11, 37, 35],
  // Real commit subjects, shortened to fit a chip.
  commits: [
    "Add 20+ outfits, headgear, pets…", "Deploy Cloudflare opening-soon site", "Add Coast Rush avatar kart racing",
    "Add East Side: a fishing jetty…", "Hop Hop: forgiving edges, power star", "Brick Bash: power-ups, a boss…",
    "Open Stage: a rhythm show…", "Invite a friend: 30 XP each", "Fix eight bugs from the playtest",
    "Make community plots playable…", "Add original chibi avatar wardrobe", "Add reversible competition seasons",
    "Make the first minute visible…", "Use shared touch joystick", "Replace lumpy hair volumes…",
    "Make rendering mobile-first", "Add a skippable 40-second intro film", "Play arcade pop in the lobby",
    "Coast Rush: live multiplayer", "Add typed chat to the shared world", "Stage Party: four dancers, one song",
    "Make immediate play the first action",
  ],
};

const C = { ink: "#1f2a3c", navy: "#243044", white: "#ffffff", cream: "#fff7e8", sky: "#bfe6ff", mint: "#bff2dc", peach: "#ffd3bd", lilac: "#d9ccff", yellow: "#ffe27a", pink: "#ff9fc0", coral: "#ff8a70", lime: "#bafa67", teal: "#62d4dc", gold: "#ffc94a", orange: "#f08a3c" };
const W = 1920, H = 1080, FPS = CONFIG.fps, DURATION = CONFIG.duration, TOTAL = FPS * DURATION, S = CONFIG.scenes, T = CONFIG.text;
const FONT = '"Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
// Portrait (story.html?portrait=1) is 1080×1920. The scenes are still drawn in the
// 1920×1080 design space: worldIn() frames part of that space in the lower half of
// the tall canvas, and uiIn() moves the captions into the space above it.
const PORTRAIT = new URLSearchParams(location.search).has("portrait"), CW = PORTRAIT ? 1080 : W, CH = PORTRAIT ? 1920 : H;
canvas.width = CW; canvas.height = CH;
const CX = PORTRAIT ? 1330 : W / 2, ZX = PORTRAIT ? 1250 : 1190; // where the estate camera rests, and where it pushes in to
function worldIn(fx, sp, lift, top, bottom) {
  ctx.save(); if (!PORTRAIT) return;
  if (top) rect(0, 0, CW, CH, top); if (bottom) rect(0, CH - lift - 2, CW, lift + 2, bottom);
  ctx.translate(CW / 2, CH - lift); ctx.scale(sp, sp); ctx.translate(-fx, -H);
}
function uiIn(dx = -20, dy = 90) { if (PORTRAIT) ctx.translate(dx, dy); }
const estateIn = (n, m) => worldIn(CX, 1, 230, mix(mixHex("#ff9d5c", "#141a3a", n), "#2a1f5c", m), mix(mixHex("#e8cf9c", "#2c2f52", n), "#4b3a7a", m));

// ---------- small maths ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
const bounce = (x) => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; };
const pop = (t, at, d = 0.32) => (t < at ? 0 : back(p(t, at, at + d)));
const h = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const pulse = (t) => Math.exp(-((t * 2) % 1) * 5); // 1 on every beat, then decays
const hex = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (a, b, k) => { const x = hex(a), y = hex(b); k = clamp(k); return `rgb(${Math.round(lerp(x[0], y[0], k))},${Math.round(lerp(x[1], y[1], k))},${Math.round(lerp(x[2], y[2], k))})`; };
const mixHex = (a, b, k) => { const x = hex(a), y = hex(b); k = clamp(k); return "#" + [0, 1, 2].map((i) => Math.round(lerp(x[i], y[i], k)).toString(16).padStart(2, "0")).join(""); };

// ---------- drawing primitives ----------
function rect(x, y, w, hh, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, hh); }
function rr(x, y, w, hh, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.roundRect(x, y, w, hh, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 4; ctx.stroke(); }
}
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fillStyle = fill; ctx.fill(); }
function line(x1, y1, x2, y2, lw, col) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap = "round"; ctx.stroke(); }
function poly(pts, fill) { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function grad(y0, y1, a, b) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function glow(x, y, r, col, a = 1) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); const [R, G, B] = hex(col); g.addColorStop(0, `rgba(${R},${G},${B},${a})`); g.addColorStop(1, `rgba(${R},${G},${B},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function at(x, y, s, rot, fn) { ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(s, s); fn(); ctx.restore(); }
function alpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }
function font(size, weight = 700, family = FONT) { ctx.font = `${weight} ${size}px ${family}`; }
function txt(s, x, y, size, fill, o = {}) {
  font(size, o.weight || 700, o.family); ctx.textAlign = o.align || "center"; ctx.textBaseline = o.base || "alphabetic"; ctx.lineJoin = "round";
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || size * 0.2; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
// Lines of text whose words pop in one after another. `out` is when they leave.
function words(lines, x, y, size, col, t, start, o = {}) {
  if (t < start) return;
  const per = o.per ?? 0.09, lh = size * 1.1, leave = o.out == null ? 0 : eo(p(t, o.out, o.out + 0.25));
  if (leave >= 1) return;
  font(size); let n = 0;
  ctx.save(); ctx.globalAlpha *= 1 - leave; ctx.translate(0, -40 * leave);
  lines.forEach((ln, li) => {
    const parts = ln.split(" "), space = ctx.measureText(" ").width;
    const widths = parts.map((w) => ctx.measureText(w).width), total = widths.reduce((a, b) => a + b, 0) + space * (parts.length - 1);
    let cx = o.center ? x - total / 2 : x;
    parts.forEach((w, wi) => {
      const k = pop(t, start + n * per, 0.3); n++;
      if (k > 0) {
        const accent = o.accent && o.accent[w.replace(/[.,?!]/g, "")];
        at(cx + widths[wi] / 2, y + li * lh - size * 0.3, k, (1 - k) * -0.15, () => txt(w, 0, size * 0.3, size, accent || col, { stroke: o.stroke, lw: o.lw }));
        font(size);
      }
      cx += widths[wi] + space;
    });
  });
  ctx.restore();
}
function bubble(s, x, y, size, t, start, o = {}) {
  const k = pop(t, start) * (o.out == null ? 1 : 1 - eo(p(t, o.out, o.out + 0.2)));
  if (k <= 0) return;
  font(size); const w = ctx.measureText(s).width + size * 1.1, hh = size * 1.9, tail = o.tail ?? 0;
  at(x, y, k, Math.sin(t * 9 + x) * 0.03, () => {
    poly([[tail - 22, hh / 2 - 6], [tail + 22, hh / 2 - 6], [tail + (o.tailX ?? -14), hh / 2 + 36]], o.fill || C.white);
    rr(-w / 2, -hh / 2, w, hh, hh / 2, o.fill || C.white, C.ink, 6);
    poly([[tail - 18, hh / 2 - 9], [tail + 18, hh / 2 - 9], [tail + (o.tailX ?? -14) * 0.8, hh / 2 + 24]], o.fill || C.white);
    txt(s, 0, size * 0.34, size, o.col || C.ink);
  });
}
function chip(s, x, y, size, k, fill = C.ink, col = C.white) {
  if (k <= 0) return;
  font(size); const w = ctx.measureText(s).width + size * 1.3, hh = size * 1.8;
  at(x, y, k, 0, () => { rr(-w / 2, -hh / 2, w, hh, hh / 2, fill); txt(s, 0, size * 0.34, size, col); });
}
function confetti(t, start, x, y, n, spread = 900) {
  const u = t - start; if (u < 0 || u > 3) return;
  const cols = [C.lime, C.coral, C.yellow, C.teal, C.pink, C.lilac];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (h(i) - 0.5) * 2.6, v = spread * (0.4 + h(i + 50));
    const px = x + Math.cos(a) * v * u * (1 - u * 0.12), py = y + Math.sin(a) * v * u + 520 * u * u;
    alpha(1 - p(u, 2, 3), () => at(px, py, 1, u * (4 + h(i + 9) * 8), () => rr(-9, -5, 18, 10, 3, cols[i % 6])));
  }
}
function stars(t, n, ymax, a) {
  for (let i = 0; i < n; i++) alpha(a * (0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + i))), () => circ(h(i) * W, h(i + 77) * ymax, 1.5 + h(i + 5) * 2.5, C.white));
}

// ---------- characters and props ----------
const KIDS = [
  { shirt: C.coral, hair: "#2b2233", skin: "#f2c39b", pants: "#3b4a6b" }, { shirt: C.teal, hair: "#3a2a20", skin: "#c98d5e", pants: "#5a3d6b" },
  { shirt: C.yellow, hair: "#1d1a24", skin: "#f6cfae", pants: "#2f5d62" }, { shirt: C.pink, hair: "#4a2c1a", skin: "#8d5a3b", pants: "#3b4a6b" },
  { shirt: C.lime, hair: "#2b2233", skin: "#e8b48a", pants: "#6b3b4a" }, { shirt: C.lilac, hair: "#141420", skin: "#f2c39b", pants: "#2f3d5d" },
  { shirt: "#ff6b6b", hair: "#3a2a20", skin: "#d9a273", pants: "#3b4a6b" }, { shirt: "#7cc4f0", hair: "#1d1a24", skin: "#f6cfae", pants: "#4a3b6b" },
  { shirt: "#ffb04a", hair: "#2b2233", skin: "#a8734c", pants: "#2f5d62" },
];
const HATS = ["crown", "cone", "cap", "star", "bow", "crown", "cap", "cone", "star"];
// Feet at (x, y). o: ph run cheer kick flip hat bob phone mouth
function kid(x, y, s, look, o = {}) {
  const { shirt, hair, skin, pants } = look, run = o.run || 0, ph = o.ph || 0, cheer = o.cheer || 0, kick = o.kick || 0;
  ctx.save(); ctx.translate(x, y - (o.bob || 0)); ctx.scale(o.flip ? -s : s, s);
  const sw = Math.sin(ph) * run, cw = Math.cos(ph) * run;
  const leg = (hx, fx, lift) => { line(hx, -36, hx + fx, -lift - 4, 13, pants); rr(hx + fx - 7, -lift - 9, 20, 10, 5, C.white); };
  leg(-8, sw * 22, Math.max(0, cw) * 14);
  leg(8, -sw * 22 + kick * 40, Math.max(0, -cw) * 14 + kick * 34);
  if (cheer) { const wv = Math.sin(ph * 2) * 5; line(-16, -70, -34 - wv, -70 - 40 * cheer, 10, skin); line(16, -70, 34 + wv, -70 - 40 * cheer, 10, skin); }
  else if (o.phone) { line(-14, -68, 4, -52, 10, skin); line(16, -68, 22, -54, 10, skin); }
  else { line(-16, -68, -22 - sw * 18, -44, 10, skin); line(16, -68, 22 + sw * 18, -44, 10, skin); }
  rr(-18, -82, 36, 50, 14, shirt);
  if (o.phone) { glow(18, -70, 60, "#7fd6ff", 0.55); rr(10, -66, 14, 22, 3, "#cfefff"); }
  const hy = -106 + (o.phone ? 5 : 0);
  circ(0, hy, 27, skin);
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(0, hy - 3, 28.5, Math.PI * 0.98, Math.PI * 2.02); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-4, hy - 15, 24, 11, -0.15, 0, 7); ctx.fill();
  const ey = hy + 3 + (o.phone ? 5 : 0);
  circ(4, ey, 3.6, C.ink); circ(18, ey, 3.6, C.ink); circ(-6, ey + 10, 5, "rgba(255,120,120,.35)");
  ctx.strokeStyle = C.ink; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.beginPath();
  if (o.mouth === "open") { ctx.ellipse(11, ey + 12, 6, 7, 0, 0, 7); ctx.fillStyle = "#7a2c2c"; ctx.fill(); }
  else if (o.phone) { ctx.moveTo(7, ey + 11); ctx.lineTo(15, ey + 11); ctx.stroke(); }
  else { ctx.arc(11, ey + 6, 7, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  const hat = o.hat;
  if (hat === "crown") poly([[-22, hy - 22], [-24, hy - 52], [-11, hy - 38], [0, hy - 58], [11, hy - 38], [24, hy - 52], [22, hy - 22]], C.gold);
  if (hat === "cone") { poly([[-24, hy - 20], [0, hy - 78], [24, hy - 20]], "#9a6bff"); rr(-34, hy - 26, 68, 10, 5, "#7a4be0"); circ(0, hy - 78, 6, C.yellow); }
  if (hat === "cap") { ctx.fillStyle = C.teal; ctx.beginPath(); ctx.arc(0, hy - 8, 29, Math.PI, 0); ctx.fill(); rr(4, hy - 14, 40, 9, 4, "#3aa9b3"); }
  if (hat === "star") at(0, hy - 42, 1, Math.sin(ph) * 0.2, () => star(0, 0, 20, C.yellow));
  if (hat === "bow") { poly([[0, hy - 28], [-26, hy - 44], [-26, hy - 14]], C.pink); poly([[0, hy - 28], [26, hy - 44], [26, hy - 14]], C.pink); circ(0, hy - 28, 7, "#ff6f9f"); }
  ctx.restore();
}
function star(x, y, r, fill) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function cat(x, y, s, t, flip) {
  at(x, y, s, 0, () => {
    if (flip) ctx.scale(-1, 1);
    ctx.strokeStyle = "#8a5a36"; ctx.lineWidth = 11; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-26, -12); ctx.quadraticCurveTo(-62, -20, -52 + Math.sin(t * 3) * 10, -62); ctx.stroke();
    ctx.fillStyle = "#b9774a"; ctx.beginPath(); ctx.ellipse(0, -26, 30, 27, 0, 0, 7); ctx.fill();
    circ(14, -62, 22, "#b9774a"); poly([[-2, -74], [2, -98], [14, -80]], "#b9774a"); poly([[16, -80], [30, -98], [32, -72]], "#b9774a");
    circ(8, -64, 3, C.ink); circ(22, -64, 3, C.ink); circ(15, -56, 2.5, "#ee7a5c"); ctx.fillStyle = "#f8f5e9"; ctx.beginPath(); ctx.ellipse(6, -14, 13, 12, 0, 0, 7); ctx.fill();
  });
}
function chapteh(x, y, s, rot) {
  at(x, y, s, rot, () => {
    [[-0.5, C.pink], [0, C.lime], [0.5, C.yellow]].forEach(([a, col]) => at(0, -8, 1, a, () => { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, -34, 11, 34, 0, 0, 7); ctx.fill(); }));
    rr(-20, -10, 40, 14, 6, "#d94a3a"); rr(-16, -14, 32, 7, 3, C.cream);
  });
}
function tree(x, y, s, leaf, trunk) { at(x, y, s, 0, () => { rr(-9, -90, 18, 90, 6, trunk); circ(0, -130, 62, leaf); circ(-44, -98, 42, leaf); circ(44, -100, 44, leaf); }); }
function palm(x, y, s, t) {
  at(x, y, s, 0, () => {
    ctx.strokeStyle = "#a9794a"; ctx.lineWidth = 16; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(14, -80, 0, -160); ctx.stroke();
    for (let i = 0; i < 6; i++) at(0, -160, 1, -2.6 + i * 0.42 + Math.sin(t * 2 + i) * 0.05, () => { ctx.fillStyle = i % 2 ? "#58b56b" : "#3f9c5a"; ctx.beginPath(); ctx.ellipse(46, 0, 50, 13, 0, 0, 7); ctx.fill(); });
  });
}
function dragon(x, y, s) {
  at(x, y, s, 0, () => {
    rr(-360, -70, 60, 70, 8, "#4a8fd6"); rr(-330, -110, 50, 40, 8, "#3b78bb");
    ctx.strokeStyle = C.orange; ctx.lineWidth = 50; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(-320, -70); ctx.bezierCurveTo(-240, -190, -120, -60, -40, -150); ctx.bezierCurveTo(10, -200, 60, -200, 110, -190); ctx.stroke();
